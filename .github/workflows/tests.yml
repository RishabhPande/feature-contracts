name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the packages the library imports
        run: pip install numpy scipy scikit-learn matplotlib
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic quickstart runs end to end
        run: python examples/quickstart_synthetic.py --fig /tmp/quickstart.png
